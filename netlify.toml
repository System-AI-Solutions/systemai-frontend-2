[build]
  publish = "."

# In-person meeting page, short links. These two sit ABOVE the book
# subdomain catch-all below, because the first matching rule wins and the
# catch-all would otherwise send book.systemai.co.uk/in-person to /book.
# systemai.co.uk/in-person also lands here instead of the /:id tracker.
[[redirects]]
  from = "https://book.systemai.co.uk/in-person"
  to = "https://systemai.co.uk/book/in-person"
  status = 301
  force = true

[[redirects]]
  from = "/in-person"
  to = "/book/in-person"
  status = 301
  force = true

# book.systemai.co.uk: short booking link. Lands on the /book page once the
# domain alias exists on this Netlify site and GoDaddy has CNAME book ->
# systemai-frontend.netlify.app. Until then this rule never matches. 302 so the
# target can move (for example to a self-hosted Cal.com) without cached hops.
[[redirects]]
  from = "https://book.systemai.co.uk/*"
  to = "https://systemai.co.uk/book"
  status = 302
  force = true

# jsmcc masjid-screen QR: pinned DIRECT so a code printed on a physical
# screen never depends on the n8n box being up (Amr, 30 Aug 2026, TG 1922).
# First match wins, so this shields /jsmcc-cafe from the tracker catch-all
# below. Retarget by editing this rule (stays 302 so phones don't cache it);
# scans still count via utm_campaign in GA/Clarity.
[[redirects]]
  from = "/jsmcc-cafe"
  to = "https://systemai.co.uk/?utm_source=jsmcc&utm_medium=shortlink&utm_campaign=jsmcc-cafe"
  status = 302
  force = false

# Tracking short links: systemai.co.uk/<id> -> n8n logs the click and 302s
# to the link's destination (Supabase `links` table). force = false means
# this ONLY fires when no real file matches, so site pages are unaffected.
[[redirects]]
  from = "/:id"
  to = "https://n8n.systemai.co.uk/webhook/go?id=:id"
  status = 302
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://cdn.jsdelivr.net https://*.clarity.ms https://unpkg.com https://app.cal.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' https://app.cal.com https://www.google-analytics.com https://region1.google-analytics.com https://www.googletagmanager.com https://*.clarity.ms https://c.bing.com; frame-src https://app.cal.com https://cal.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

